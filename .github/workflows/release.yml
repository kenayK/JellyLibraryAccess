name: Publish JellyLibraryAccess Repository

on:
  push:
    branches: [ main ]
    paths-ignore:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jellylibraryaccess-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.9
      JELLYFIN_ABI: 10.11.9.0
      PACKAGE: JellyLibraryAccess_0.1.9.0.zip
      PLUGIN_GUID: 7e742cf9-6457-4c26-96db-62d70adc9f90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.JellyLibraryAccess/Jellyfin.Plugin.JellyLibraryAccess.csproj
      - name: Publish
        run: dotnet publish Jellyfin.Plugin.JellyLibraryAccess/Jellyfin.Plugin.JellyLibraryAccess.csproj -c Release --no-restore -o publish
      - name: Package
        run: |
          rm -rf package
          mkdir package
          cp publish/Jellyfin.Plugin.JellyLibraryAccess.dll package/
          cd package
          zip -r ../"$PACKAGE" .
      - name: Calculate checksum
        id: checksum
        run: echo "md5=$(md5sum "$PACKAGE" | awk '{print toupper($1)}')" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$PACKAGE" --clobber
          else
            gh release create "v$VERSION" "$PACKAGE" --title "JellyLibraryAccess v$VERSION" --notes "Resolve baseline library membership using Jellyfin ILibraryManager.GetCollectionFolders(item), matching movies to their configured collection folders instead of inferring parent IDs."
          fi
      - name: Generate Jellyfin manifest
        env:
          CHECKSUM: ${{ steps.checksum.outputs.md5 }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          version=os.environ['VERSION']; package=os.environ['PACKAGE']
          entry={"version":version+".0","changelog":"Resolve baseline membership using Jellyfin GetCollectionFolders(item).","targetAbi":os.environ['JELLYFIN_ABI'],"sourceUrl":f"https://github.com/kenayK/JellyLibraryAccess/releases/download/v{version}/{package}","checksum":os.environ['CHECKSUM'],"timestamp":datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')}
          try:
            old=json.load(open('manifest.json',encoding='utf-8'))
            versions=old[0].get('versions',[])
          except Exception: versions=[]
          versions=[v for v in versions if v.get('version') != entry['version']]
          versions.insert(0,entry)
          data=[{"guid":os.environ['PLUGIN_GUID'],"name":"JellyLibraryAccess","description":"Approve individual Jellyfin movies for restricted profiles without moving media files.","overview":"Per-title library access using Jellyfin Allowed Tags, with persistent TMDb/IMDb matching.","owner":"kenayK","category":"General","versions":versions}]
          with open('manifest.json','w',encoding='utf-8') as f: json.dump(data,f,indent=2); f.write('\n')
          PY
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Jellyfin plugin manifest for v$VERSION"
          git fetch origin main
          git rebase origin/main
          git push origin main
